<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>访问验证 · 三角洲行动六图攻略</title>
<style>
:root{--canvas:#0a0d0b;--panel:#111513;--gold:#e0a638;--gold-2:#f0b94a;--line:rgba(224,166,56,.28);--txt:#e8e6dd;--dim:#8a8f88;--red:#ff5a4e;--mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--canvas);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
body.unlocked{overflow:auto}
#bg{position:fixed;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:44px 44px;opacity:.16;pointer-events:none}
#bg::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,transparent 0%,rgba(10,13,11,.9) 78%)}
#gate{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;z-index:10}
#gate.show{display:flex}
.box{width:100%;max-width:400px;position:relative}
.tag{font-family:var(--mono);font-size:11px;letter-spacing:.32em;color:var(--gold);text-transform:uppercase;display:flex;align-items:center;gap:10px;margin-bottom:18px}
.tag::before{content:"";width:26px;height:2px;background:var(--gold)}
.tag::after{content:"";flex:1;height:1px;background:var(--line)}
h1{font-family:var(--mono);font-size:21px;font-weight:700;letter-spacing:.06em;line-height:1.5;color:#f3f1e9}
h1 span{color:var(--gold-2)}
.sub{margin-top:10px;font-size:13px;color:var(--dim);line-height:1.7}
.panel{margin-top:26px;background:linear-gradient(180deg,rgba(224,166,56,.05),rgba(224,166,56,.01));border:1px solid var(--line);padding:24px 22px;clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}
label{font-family:var(--mono);font-size:10px;letter-spacing:.28em;color:var(--dim);text-transform:uppercase}
#code{width:100%;margin-top:9px;background:#0c0f0d;border:1px solid var(--line);color:var(--gold-2);font-family:var(--mono);font-size:20px;letter-spacing:.22em;text-align:center;text-transform:uppercase;padding:15px 12px;outline:none;transition:border-color .15s}
#code:focus{border-color:var(--gold);box-shadow:0 0 0 1px rgba(224,166,56,.25)}
#code.shake{animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
#btn{width:100%;margin-top:16px;padding:14px;border:1px solid var(--gold);background:linear-gradient(180deg,rgba(224,166,56,.22),rgba(224,166,56,.08));color:#1a1407;font-family:var(--mono);font-size:14px;font-weight:700;letter-spacing:.4em;text-indent:.4em;cursor:pointer;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);transition:filter .15s}
#btn:hover{filter:brightness(1.15)}
#btn:disabled{opacity:.55;cursor:wait;letter-spacing:.2em}
#msg{min-height:18px;margin-top:13px;font-size:12px;font-family:var(--mono);letter-spacing:.06em;color:var(--red);text-align:center}
.remember{margin-top:14px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);cursor:pointer;user-select:none}
.remember input{accent-color:var(--gold);width:14px;height:14px}
.fan{margin-top:22px;text-align:center;font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:#5c615a;text-transform:uppercase;line-height:1.9}
#stage{position:fixed;inset:0;width:100%;height:100%;border:0;display:none;background:var(--canvas)}
</style>
</head>
<body>
<div id="bg"></div>
<div id="gate">
  <div class="box">
    <div class="tag">Restricted · Access Required</div>
    <h1>三角洲行动 · 六图攻略<br><span>受限战术情报</span></h1>
    <div class="sub">本页面仅限授权客户访问。<br>请输入你拿到的专属访问码解锁内容。</div>
    <div class="panel">
      <label for="code">Access Code / 访问码</label>
      <input id="code" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" placeholder="DF-XXXX-XXXX" maxlength="20">
      <button id="btn">解 锁</button>
      <div id="msg"></div>
      <label class="remember"><input type="checkbox" id="remember" checked> 本机保持登录 7 天，勿在公共电脑勾选</label>

<script>
'use strict';
var LS_AUTH='df_gate_auth_v1', LS_FAIL='df_gate_fail_v1';
var AUTH_TTL=7*24*3600*1000, FAIL_MAX=5, LOCK_MS=30000;
var vault=JSON.parse(document.getElementById('vault').textContent);
var gate=document.getElementById('gate'), codeInput=document.getElementById('code'),
    btn=document.getElementById('btn'), msg=document.getElementById('msg'),
    stage=document.getElementById('stage'), remember=document.getElementById('remember');

function b64dec(s){
  var b=atob(s.replace(/-/g,'+').replace(/_/g,'/')),u=new Uint8Array(b.length);
  for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;
}
function b64enc(u){var s='';for(var i=0;i<u.length;i+=0x8000){s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));}return btoa(s);}
var enc=new TextEncoder();
function deriveKey(code,salt){
  return crypto.subtle.importKey('raw',enc.encode(code),'PBKDF2',false,['deriveKey'])
  .then(function(base){
    return crypto.subtle.deriveKey(
      {name:'PBKDF2',salt:salt,iterations:vault.iter||200000,hash:'SHA-256'},
      base,{name:'AES-GCM',length:256},false,['decrypt']);
  });
}
function recoverMaster(code){
  var i=0;
  function next(){
    if(i>=vault.keys.length)return Promise.resolve(null);
    var e=vault.keys[i++];
    return deriveKey(code,b64dec(e.s)).then(function(wk){
      return crypto.subtle.decrypt({name:'AES-GCM',iv:b64dec(e.n)},wk,b64dec(e.d))
        .then(function(raw){return new Uint8Array(raw);})
        .catch(function(){return next();});
    });
  }
  return next();
}
function openWith(mk){
  var raw=b64dec(vault.payload),iv=raw.slice(0,12),data=raw.slice(12);
  return crypto.subtle.importKey('raw',mk,'AES-GCM',false,['decrypt'])
  .then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:iv},k,data);})
  .then(function(buf){
    stage.srcdoc=new TextDecoder().decode(buf);
    stage.style.display='block';
    gate.classList.remove('show');
    document.body.classList.add('unlocked');
  });
}
function getFail(){try{return JSON.parse(localStorage.getItem(LS_FAIL)||'null')||{n:0,until:0};}catch(e){return {n:0,until:0};}}
function setFail(f){localStorage.setItem(LS_FAIL,JSON.stringify(f));}
function refreshLock(){
  var f=getFail(),left=f.until-Date.now();
  if(left>0){
    btn.disabled=true;codeInput.disabled=true;
    msg.style.color='var(--gold)';
    msg.textContent='尝试过多，请 '+Math.ceil(left/1000)+' 秒后再试';
    setTimeout(refreshLock,1000);
    return true;
  }
  btn.disabled=false;codeInput.disabled=false;msg.textContent='';
  return false;
}
function unlock(){
  if(btn.disabled)return;
  var code=codeInput.value.trim().toUpperCase().replace(/\s+/g,'');
  if(!code){msg.style.color='var(--red)';msg.textContent='请先输入访问码';return;}
  btn.disabled=true;btn.textContent='验 证 中';
  recoverMaster(code).then(function(mk){
    if(!mk){
      var f=getFail();f.n=(f.n||0)+1;
      if(f.n>=FAIL_MAX){f.until=Date.now()+LOCK_MS;f.n=0;}
      setFail(f);
      btn.textContent='解 锁';refreshLock();
      msg.style.color='var(--red)';msg.textContent='访问码无效，未授权无法查看';
      codeInput.classList.add('shake');setTimeout(function(){codeInput.classList.remove('shake');},320);
      codeInput.select();
      return;
    }
    localStorage.removeItem(LS_FAIL);
    if(remember.checked)localStorage.setItem(LS_AUTH,JSON.stringify({t:Date.now(),k:b64enc(mk)}));
    else sessionStorage.setItem(LS_AUTH,JSON.stringify({t:Date.now(),k:b64enc(mk)}));
    return openWith(mk);
  }).catch(function(){
    btn.textContent='解 锁';btn.disabled=false;
    msg.style.color='var(--red)';msg.textContent='当前环境不支持解密，请用最新版浏览器经 https 打开';
  });
}
btn.addEventListener('click',unlock);
codeInput.addEventListener('keydown',function(e){if(e.key==='Enter')unlock();});
codeInput.addEventListener('input',function(){codeInput.value=codeInput.value.toUpperCase();});

(function boot(){
  if(!window.crypto||!crypto.subtle){
    gate.classList.add('show');btn.disabled=true;
    msg.style.color='var(--red)';msg.textContent='请用最新版浏览器经 https 链接打开本页面';
    return;
  }
  var saved=null;
  try{saved=JSON.parse(localStorage.getItem(LS_AUTH)||sessionStorage.getItem(LS_AUTH)||'null');}catch(e){}
  if(saved&&Date.now()-saved.t<AUTH_TTL){
    openWith(b64dec(saved.k)).catch(function(){
      localStorage.removeItem(LS_AUTH);sessionStorage.removeItem(LS_AUTH);
      gate.classList.add('show');refreshLock();codeInput.focus();
    });
  }else{
    gate.classList.add('show');refreshLock();codeInput.focus();
  }
})();
</script>
